name: Android CI

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create releases and upload APK assets

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can count commits for auto-version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug
        working-directory: android-app
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-debug-${{ github.sha }}
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ── Auto-release on every push to main ───────────────────────────────────
      - name: Compute auto-release tag
        if: github.ref == 'refs/heads/main'
        id: tag
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "name=build-${COUNT}-${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Create rolling dev release on main push
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Dev build ${{ steps.tag.outputs.name }}"
          body: |
            Automated build from commit ${{ github.sha }}

            > This is a development build created automatically on every merge to `main`.
            > For stable releases use a `v*` tag.
          files: android-app/app/build/outputs/apk/debug/*.apk
          prerelease: true

      # ── Stable release on v* tag push ────────────────────────────────────────
      - name: Create stable GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          name: "Photo Sync ${{ github.ref_name }}"
          prerelease: false
