name: Windows tool tests

on:
  push:
    branches: [ main ]
    paths: [ '*.py', 'tests/**', 'templates/**', 'requirements*.txt', '.github/workflows/python.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ '*.py', 'tests/**', 'templates/**', 'requirements*.txt', '.github/workflows/python.yml' ]

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python: [ '3.9', '3.14' ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install ExifTool and ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl ffmpeg

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # On Windows the ExifTool integration tests skip themselves when it is missing.
      - name: Run tests
        run: python -m pytest tests/ -q
